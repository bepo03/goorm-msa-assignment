server:
  port: 8000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/catalog/**
            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
