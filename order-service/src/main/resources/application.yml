server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:mem:order-db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true

clients:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}

logging:
  level:
    com.example.bookstore.order.client.CatalogClient: DEBUG
