server:
  port: 8081

spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:h2:mem:catalog-db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
